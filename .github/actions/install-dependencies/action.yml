name: "Install Dependencies"
description: "Install uv and sync the locked project environment into an activated .venv"
inputs:
  python-version:
    description: "Python version to install the environment for"
    required: true
  test:
    description: "Should the 'test' dependency group be installed"
    default: "false"
    required: false
  docs:
    description: "Should the 'docs' dependency group be installed"
    default: "false"
    required: false
runs:
  using: "composite"
  steps:
    - name: "Install uv"
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.12.21"
        python-version: ${{ inputs.python-version }}
        activate-environment: "true"

    - name: "Install Python dependencies"
      shell: "bash"
      env:
        INSTALL_TEST: ${{ inputs.test }}
        INSTALL_DOCS: ${{ inputs.docs }}
      run: |
        SYNC_ARGS=()
        if [[ "${INSTALL_TEST}" == "true" ]]; then SYNC_ARGS+=(--group test); fi
        if [[ "${INSTALL_DOCS}" == "true" ]]; then SYNC_ARGS+=(--group docs); fi
        # --locked fails if uv.lock is out of date with pyproject.toml
        uv sync --locked --no-default-groups "${SYNC_ARGS[@]}"
