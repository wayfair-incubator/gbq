name: Version Bump merged

on:
  pull_request:
    types:
      - "closed"
    branches:
      - "main"

permissions:
  contents: read

jobs:
  trigger-release:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged &&
        startsWith(github.head_ref, 'bump_version_to_') &&
        startsWith(github.event.pull_request.title, 'Bump version') &&
        contains(github.event.pull_request.title, ' → ')
    environment: Create Release
    permissions:
      contents: write # create the release and its tag
      actions: write # dispatch the Publish Release workflow
    steps:
      - name: Get new version
        id: get-new-version
        # Branch names are user-controlled: pass them through env, never interpolate into the script.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          NEW_VERSION=$(echo "${HEAD_REF}" | cut -d _ -f4)
          if [[ ! "${NEW_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Branch '${HEAD_REF}' does not end in a valid version."
            exit 1
          fi
          echo "version=${NEW_VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Is prerelease?
        id: is-prerelease
        env:
          NEW_VERSION: ${{ steps.get-new-version.outputs.version }}
        run: |
          IS_PRERELEASE=$([[ "${NEW_VERSION}" == *-[a-z]* ]] && echo true || echo false)
          echo "result=${IS_PRERELEASE}" >> "${GITHUB_OUTPUT}"
      - name: Check out the merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Extract release notes from the CHANGELOG
        env:
          NEW_VERSION: ${{ steps.get-new-version.outputs.version }}
        run: |
          # The section between "## [<version>]" and the next "## [" heading
          awk -v heading="## [${NEW_VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::CHANGELOG.md has no '## [${NEW_VERSION}]' section."
            exit 1
          fi
      - name: Create Release
        # Created with GITHUB_TOKEN. Unlike a personal access token, it does not trigger the
        # Publish Release workflow's release event, so that workflow is dispatched below.
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: v${{ steps.get-new-version.outputs.version }}
          name: v${{ steps.get-new-version.outputs.version }} Release
          # Tag exactly what was merged, even if main has moved on since
          commit: ${{ github.event.pull_request.merge_commit_sha }}
          bodyFile: release-notes.md
          prerelease: ${{ steps.is-prerelease.outputs.result }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.get-new-version.outputs.version }}
          PRERELEASE: ${{ steps.is-prerelease.outputs.result }}
        run: |
          gh workflow run publish_release.yml --repo "${GITHUB_REPOSITORY}" --ref main \
            -f tag="${TAG}" -f prerelease="${PRERELEASE}"
