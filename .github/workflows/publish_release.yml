name: Publish Release

on:
  # A release created by hand, or by a personal access token
  release:
    types: [published]
  # Dispatched by the Version Bump merged workflow, whose release (created with GITHUB_TOKEN)
  # does not trigger the release event
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v2.0.0"
        required: true
        type: string
      prerelease:
        description: "Whether the release is a prerelease (it then doesn't become the docs' latest version)"
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.12"
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  RELEASE_PRERELEASE: ${{ github.event_name == 'release' && format('{0}', github.event.release.prerelease) || inputs.prerelease }}

# Least privilege by default; jobs that push or publish opt in to more.
permissions:
  contents: read

jobs:
  update_docs_for_version_bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write # mike pushes to gh-pages
    # One gh-pages deploy at a time, shared with the CI workflow's dev docs deploy
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          docs: "true"

      - name: Push documentation changes
        uses: ./.github/actions/publish-docs-with-mike
        with:
          new_version: true
          release_tag: ${{ env.RELEASE_TAG }}
          prerelease: ${{ env.RELEASE_PRERELEASE }}

  build-distributions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build wheel
        uses: ./.github/actions/build-dist

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: ./dist

  publish-to-pypi:
    runs-on: ubuntu-latest
    environment: "Publish Release"
    permissions:
      id-token: write # PyPI trusted publishing
    needs: ["build-distributions"]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
            name: distributions
            path: ./dist

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
